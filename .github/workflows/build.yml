name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The VPN daemon bundle (openvpn/libreswan/strongswan/...) is built in
      # Docker once and reused; build.sh skips it when backend/bin is populated.
      - uses: actions/cache@v4
        with:
          path: backend/bin
          key: bundle-${{ runner.arch }}-${{ hashFiles('build/backend/build.sh') }}

      - name: build
        run: ./build.sh

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: vpn-ui-amd64
          path: build/out/vpn-ui-amd64
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/vpn-ui-amd64
